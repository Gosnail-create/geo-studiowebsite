sezioni:
  - titolo: Perché conviene avere un solo interlocutore tecnico
    blocchi:
      # seconda frase della hero, spostata qui (docs/testi-revisione.md)
      - tipo: p
        testo: Un unico gruppo di tecnici segue il lavoro dal primo sopralluogo fino alle pratiche con gli enti e alle verifiche degli anni successivi.
      - tipo: p
        testo: In un'azienda produttiva gli obblighi tecnici arrivano quasi sempre insieme. L'ampliamento di un capannone, per esempio, porta con sé la revisione della pratica antincendio, l'aggiornamento del documento di valutazione dei rischi, spesso un nuovo impianto elettrico e talvolta una diversa autorizzazione alle emissioni. Se ogni parte è affidata a un consulente diverso, le informazioni si disperdono e i tempi si allungano, perché nessuno ha davanti il quadro completo. Da noi progettisti di impianti e consulenti per qualità, ambiente e sicurezza lavorano nello stesso studio e sugli stessi incarichi. Per voi questo significa un referente unico, documenti coerenti fra loro e un solo calendario in cui tenere sotto controllo scadenze e rinnovi.
  - titolo: Di cosa ci occupiamo
    blocchi:
      - tipo: p
        testo: Le nostre attività si raccolgono in sette aree. Potete affidarci un singolo adempimento oppure l'intera gestione tecnica, e decidere più avanti se allargare l'incarico.
      - tipo: servizi
        voci:
          - titolo: Progettazione impianti tecnologici
            testo: Impianti elettrici, termici, idraulici e di climatizzazione per edifici civili e industriali, classificazione delle aree ATEX e verifiche periodiche degli impianti di messa a terra.
          - titolo: Energie rinnovabili
            testo: "Fotovoltaico, mini-eolico, biometano e idroelettrico: dallo studio di fattibilità alla progettazione, alle autorizzazioni e al supporto in cantiere."
          - titolo: Sicurezza negli ambienti di lavoro
            testo: Documento di valutazione dei rischi, misure strumentali di rumore, vibrazioni e agenti fisici, incarichi di RSPP esterno secondo il D.Lgs. 81/2008.
          - titolo: Consulenza ambientale
            testo: Autorizzazioni per emissioni e rifiuti, pratiche sulle acque, valutazioni di impatto acustico e requisiti acustici degli edifici.
          - titolo: Prevenzione incendi
            testo: Progetti, SCIA e rinnovi presso i Vigili del Fuoco, piani di emergenza, formazione degli addetti e prove di evacuazione.
          - titolo: Sistemi di gestione
            testo: Qualità, ambiente, salute e sicurezza e sicurezza alimentare secondo le norme ISO, standard della filiera agroalimentare e modelli organizzativi 231.
          - titolo: Formazione
            testo: Corsi obbligatori per lavoratori, preposti, dirigenti e datori di lavoro, addetti alle emergenze, conduttori di attrezzature e alimentaristi.
        linkLabel: Approfondite
  - titolo: Come lavoriamo
    blocchi:
      - tipo: foto
        foto: sopralluogo-tecnico-cartellina
      - tipo: p
        testo: Che si tratti di un documento di valutazione dei rischi o di un impianto a biometano, ogni incarico segue lo stesso percorso di fondo. Partiamo dal luogo e dalle persone, perché le carte da sole non dicono come si lavora davvero in un reparto. Le soluzioni arrivano dopo, e restano sotto controllo anche quando l'incarico iniziale è concluso.
      - tipo: passi
        voci:
          - Sopralluogo e analisi. Conosciamo l'attività, gli ambienti, gli impianti e gli obblighi che la riguardano.
          - Progetto o valutazione. Definiamo le soluzioni tecniche, le misure e i documenti necessari.
          - Pratiche e attuazione. Presentiamo le pratiche agli enti competenti e vi affianchiamo nell'applicazione.
          - Verifica nel tempo. Teniamo sotto controllo scadenze, rinnovi e cambiamenti normativi.
        titoloInline: true
  - titolo: Chi siamo
    blocchi:
      - tipo: foto
        foto: tecnici-cantiere-tavola-progetto
      - tipo: p
        testo: "Geo Studio Engineering lavora dal 1990 con aziende artigiane, piccole e medie imprese, grandi gruppi ed enti pubblici di tutta Italia. Lo studio ha sede a Bovolone, in provincia di Verona, ed è organizzato in due divisioni: una progetta gli impianti tecnologici, l'altra segue qualità, ambiente, salute e sicurezza, l'area che in azienda si chiama QHSE. I settori che conosciamo meglio sono l'industria manifatturiera e metalmeccanica, la chimica e la farmaceutica, i trasporti, i servizi e l'agricoltura. Il nostro sistema di gestione per la qualità è certificato ISO 9001 da oltre quindici anni, e lo applichiamo prima di tutto a noi stessi."
      - tipo: pannello
        voci:
          - valore: "1990"
            descrizione: anno di fondazione
          - valore: ISO 9001
            descrizione: sistema qualità certificato
          - valore: 2 divisioni
            descrizione: impianti e QHSE
      - tipo: link
        label: Conoscete Geo Studio
        href: /chi-siamo/
  - titolo: Approfondimenti tecnici e normativi
    blocchi:
      - tipo: p
        testo: Nel blog i nostri tecnici spiegano le norme e i casi pratici che incontrano nelle aziende.
      - tipo: blog
      - tipo: link
        label: Tutti gli articoli
        href: /blog/
chiusura:
  titolo: Avete un adempimento da gestire o un impianto da progettare?
  testo: Raccontateci in poche righe di cosa si tratta. Un nostro tecnico vi ricontatta per capire la situazione e proporvi il percorso più adatto.
  bottone: Parlate con un nostro tecnico
